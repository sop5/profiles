<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロフィール</title>
    <link rel="stylesheet" href="cdnjs.cloudflare.com">
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .card { background: white; width: 100%; max-width: 420px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; display: none; }
        h1 { margin: 0 0 5px 0; font-size: 24px; color: #1a1a1a; }
        .id-label { color: #888; font-size: 14px; margin-bottom: 20px; font-weight: bold; }
        .sns-container { display: flex; justify-content: center; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
        .sns-btn { text-decoration: none; color: white; padding: 10px 22px; border-radius: 30px; display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 14px; }
        .btn-x { background: #000; }
        .btn-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .label { font-weight: bold; font-size: 12px; color: #4b5563; background: #f3f4f6; padding: 4px 10px; border-radius: 6px; display: inline-block; margin-top: 15px; }
        .content { margin-top: 6px; margin-bottom: 15px; line-height: 1.7; border-bottom: 1px solid #f3f4f6; padding-bottom: 12px; text-align: left; white-space: pre-wrap; color: #374151; }
    </style>
</head>
<body>
    <div id="profile-card" class="card">
        <h1 id="disp-name"></h1>
        <div id="disp-id" class="id-label"></div>
        <div class="sns-container" id="sns-container"></div>
        <div class="label">好きなサッカークラブ</div><div id="disp-clubs" class="content"></div>
        <div class="label">観戦エリア</div><div id="disp-area" class="content"></div>
        <div class="label">自己紹介</div><div id="disp-intro" class="content"></div>
    </div>
    <p id="loading">読み込み中...</p>
    <p id="error" style="display:none">プロフィールが見つかりませんでした。</p>

    <script>
        const CSV_URL = 'docs.google.com';
        
        const path = window.location.pathname.split('/').filter(s => s.length > 0);
        const searchId = path[path.length - 1];

        fetch(CSV_URL)
            .then(res => res.text())
            .then(text => {
                // シンプルにカンマで分割
                const rows = text.split(/\r?\n/).map(row => row.split(',').map(cell => cell.replace(/^"(.*)"$/, '$1').trim()));
                
                // B列(index 1)をIDとして検索。000が0になっても一致するように比較。
                const user = rows.find(row => {
                    const rid = String(row[1] || "").padStart(3, '0');
                    const tid = String(searchId || "").padStart(3, '0');
                    return rid === tid;
                });

                document.getElementById('loading').style.display = 'none';

                if (user) {
                    // 列を直接指定 (B=1, C=2, D=3, E=4, F=5, G=6, H=7)
                    document.getElementById('disp-name').innerText = user[2] || "名前なし";
                    document.getElementById('disp-id').innerText = 'ID：' + user[1];
                    document.getElementById('disp-clubs').innerText = user[5] || "未回答";
                    document.getElementById('disp-area').innerText = user[6] || "未回答";
                    document.getElementById('disp-intro').innerText = user[7] || "未回答";
                    
                    let snsHtml = '';
                    const x = (user[3] || "").replace('@','').trim();
                    const insta = (user[4] || "").replace('@','').trim();

                    if(x) snsHtml += `<a href="x.com{x}" target="_blank" rel="noopener noreferrer" class="sns-btn btn-x"><i class="fa-brands fa-x-twitter"></i> X</a>`;
                    if(insta) snsHtml += `<a href="instagram.com{insta}" target="_blank" rel="noopener noreferrer" class="sns-btn btn-insta"><i class="fa-brands fa-instagram"></i> Instagram</a>`;
                    
                    document.getElementById('sns-container').innerHTML = snsHtml;
                    document.getElementById('profile-card').style.display = 'block';
                } else {
                    document.getElementById('error').style.display = 'block';
                }
            });
    </script>
</body>
</html>
