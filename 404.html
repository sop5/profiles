<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロフィール</title>
    <link rel="stylesheet" href="cdnjs.cloudflare.com">
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .card { background: white; width: 100%; max-width: 400px; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; display: none; }
        h1 { margin-bottom: 5px; font-size: 24px; }
        .id-label { color: #888; font-size: 14px; margin-bottom: 20px; font-weight: bold; }
        .sns-container { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        .sns-btn { text-decoration: none; color: white; padding: 10px 20px; border-radius: 25px; display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 14px; }
        .btn-x { background: #000; }
        .btn-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .label { font-weight: bold; font-size: 12px; color: #2c3e50; background: #e9ecef; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-top: 15px; }
        .content { margin-top: 5px; margin-bottom: 15px; line-height: 1.6; border-bottom: 1px solid #eee; padding-bottom: 10px; text-align: left; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div id="profile-card" class="card">
        <h1 id="name"></h1>
        <div id="id-label" class="id-label"></div>
        <div class="sns-container" id="sns-container"></div>
        <div class="label">好きなサッカークラブ</div><div id="clubs" class="content"></div>
        <div class="label">観戦エリア</div><div id="area" class="content"></div>
        <div class="label">自己紹介</div><div id="intro" class="content"></div>
    </div>
    <p id="loading">読み込み中...</p>
    <p id="error" style="display:none">プロフィールが見つかりませんでした。</p>

    <script>
        const CSV_URL = 'docs.google.com';
        
        const searchId = window.location.pathname.split('/').filter(s => s.length > 0).pop();

        fetch(CSV_URL)
            .then(res => res.text())
            .then(text => {
                // CSVをパース（見出し行を除外してデータのみ抽出）
                const allRows = text.split(/\r?\n/).filter(line => line.trim().length > 0).map(row => row.split(',').map(cell => cell.replace(/^"(.*)"$/, '$1').trim()));
                const dataRows = allRows.slice(1); // 1行目の見出しをカット
                
                // ID一致確認（B列 = index 1）を厳密に行う
                const userRow = dataRows.find(row => {
                    const rowId = String(row[1] || "").padStart(3, '0');
                    const targetId = String(searchId || "").padStart(3, '0');
                    return rowId === targetId;
                });

                document.getElementById('loading').style.display = 'none';

                if (userRow) {
                    // 正しいインデックスで表示
                    document.getElementById('name').innerText = userRow[2] || "無名";     // C列
                    document.getElementById('id-label').innerText = 'ID：' + userRow[1]; // B列
                    document.getElementById('clubs').innerText = userRow[5] || "未回答";  // F列
                    document.getElementById('area').innerText = userRow[6] || "未回答";   // G列
                    document.getElementById('intro').innerText = userRow[7] || "未回答";  // H列
                    
                    let snsHtml = '';
                    const xId = String(userRow[3] || "").replace('@',''); // D列
                    const instaId = String(userRow[4] || "").replace('@',''); // E列

                    if(xId && xId !== "undefined") {
                        snsHtml += `<a href="x.com{xId}" target="_blank" rel="noopener noreferrer" class="sns-btn btn-x"><i class="fa-brands fa-x-twitter"></i> X</a>`;
                    }
                    if(instaId && instaId !== "undefined") {
                        snsHtml += `<a href="instagram.com{instaId}" target="_blank" rel="noopener noreferrer" class="sns-btn btn-insta"><i class="fa-brands fa-instagram"></i> Instagram</a>`;
                    }
                    
                    document.getElementById('sns-container').innerHTML = snsHtml;
                    document.getElementById('profile-card').style.display = 'block';
                } else {
                    document.getElementById('error').style.display = 'block';
                }
            })
            .catch(err => {
                document.getElementById('loading').innerText = '通信エラー';
            });
    </script>
</body>
</html>
