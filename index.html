<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Profile</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: #1a1a1a; padding: 2rem; border-radius: 15px; border: 1px solid #333; width: 100%; max-width: 500px; box-shadow: 0 0 20px rgba(255,255,255,0.05); }
        h1 { color: #fff; margin-bottom: 1.5rem; text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .info-item { margin-bottom: 15px; border-bottom: 1px dashed #333; padding-bottom: 8px; }
        .label { font-size: 0.8rem; color: #888; display: block; margin-bottom: 2px; }
        .value { font-size: 1.1rem; color: #fff; white-space: pre-wrap; word-wrap: break-word; }
        .id-badge { text-align: center; margin-bottom: 1rem; }
        .id-badge span { background: #fff; color: #000; padding: 3px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .loading { text-align: center; color: #888; }
    </style>
</head>
<body>
    <div id="app" class="card">
        <p class="loading">プロフィールを読み込み中...</p>
    </div>

    <script>
        const CSV_URL = 'docs.google.com';

        async function loadProfile() {
            const app = document.getElementById('app');
            const targetId = decodeURIComponent(window.location.hash.substring(1)).trim(); 

            if (!targetId) {
                app.innerHTML = '<h1>Welcome</h1><p style="text-align:center;">QRコードを読み取ってください</p>';
                return;
            }

            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                
                // CSVをパース（改行とカンマで分割。引用符も考慮）
                const rows = csvText.split('\n').map(row => {
                    return row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"(.*)"$/, '$1').trim());
                });

                const headers = rows[0]; // 1行目（タイムスタンプ, ID, 名前...）
                // 2列目（インデックス1）がID列であると想定
                const userData = rows.find(row => row[1] === targetId);

                if (userData) {
                    let html = `<div class="id-badge"><span>ID: ${userData[1]}</span></div>`;
                    html += `<h1>GUEST PROFILE</h1>`;
                    
                    // すべての項目をループで表示（タイムスタンプ(0)とID(1)以外を表示したい場合は i=2 から開始）
                    for (let i = 2; i < headers.length; i++) {
                        if (userData[i]) { // 値が入っている場合のみ表示
                            html += `
                                <div class="info-item">
                                    <span class="label">${headers[i]}</span>
                                    <span class="value">${userData[i]}</span>
                                </div>
                            `;
                        }
                    }
                    app.innerHTML = html;
                } else {
                    app.innerHTML = '<h1>Not Found</h1><p style="text-align:center;">プロフィールが見つかりません。入力直後の場合は5分ほどお待ちください。</p>';
                }
            } catch (e) {
                app.innerHTML = '<h1>Error</h1><p style="text-align:center;">データの読み込みに失敗しました。</p>';
                console.error(e);
            }
        }

        window.addEventListener('hashchange', loadProfile);
        loadProfile();
    </script>
</body>
</html>
