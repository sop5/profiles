<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Event Profile</title>
    <style>
        body { font-family: sans-serif; background-color: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: #111; padding: 2rem; border-radius: 15px; border: 1px solid #333; width: 100%; max-width: 450px; }
        h1 { border-bottom: 2px solid #444; padding-bottom: 10px; font-size: 1.4rem; text-align: center; }
        .info-item { margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 8px; }
        .label { font-size: 0.7rem; color: #888; display: block; margin-bottom: 2px; }
        .value { font-size: 1.1rem; color: #eee; white-space: pre-wrap; }
        .id-badge { text-align: center; margin-bottom: 1rem; }
        .id-badge span { background: #fff; color: #000; padding: 3px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>
    <div id="app" class="card">LOADING...</div>

    <script>
        // 【重要】ステップ1でコピーしたGASのURLに差し替えてください
        const GAS_API_URL = 'ここにコピーしたGASのURLを貼り付け';

        async function loadProfile() {
            const app = document.getElementById('app');
            const targetId = decodeURIComponent(window.location.hash.substring(1)).trim();

            if (!targetId) {
                app.innerHTML = '<h1>Welcome</h1><p style="text-align:center;">QRコードをスキャンしてください</p>';
                return;
            }

            try {
                // GASにデータを直接取りに行く（ラグなし）
                const response = await fetch(GAS_API_URL);
                const data = await response.json();
                
                const headers = data[0]; // 1行目（項目名）
                // B列（インデックス1）がIDと一致する行を探す
                const userData = data.find((row, index) => index > 0 && String(row[1]).trim() === targetId);

                if (userData) {
                    let html = `<div class="id-badge"><span>ID: ${userData[1]}</span></div>`;
                    html += `<h1>GUEST PROFILE</h1>`;
                    
                    // C列（インデックス2）以降をすべて表示
                    for (let i = 2; i < headers.length; i++) {
                        if (userData[i]) {
                            html += `<div class="info-item">
                                <span class="label">${headers[i]}</span>
                                <span class="value">${userData[i]}</span>
                            </div>`;
                        }
                    }
                    app.innerHTML = html;
                } else {
                    app.innerHTML = `<h1>NOT FOUND</h1><p style="text-align:center;">ID「${targetId}」はまだ登録されていないか、間違っています。</p>`;
                }
            } catch (e) {
                app.innerHTML = '<h1>ERROR</h1><p>読み込みに失敗しました。再読み込みしてください。</p>';
            }
        }

        window.addEventListener('hashchange', loadProfile);
        loadProfile();
    </script>
</body>
</html>
