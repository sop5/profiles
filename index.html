<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Event Profile</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1a1a1a; padding: 2rem; border-radius: 15px; border: 1px solid #333; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 0 20px rgba(255,255,255,0.05); }
        h1 { color: #fff; margin: 1rem 0; font-size: 1.8rem; }
        p { color: #ccc; font-size: 1rem; line-height: 1.6; white-space: pre-wrap; }
        .id-badge { display: inline-block; background: #fff; color: #000; padding: 3px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .loading { color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div id="app" class="card">
        <p class="loading">プロフィールを読み込み中...</p>
    </div>

    <script>
        // 2026年1月現在、sop5さんが指定したCSV URL
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQRS0zEg8V_eSDWltQxsveXX0Zl0LSv7Awk9pnALuGlDMwDunbV4Oe3fF-1y6R2OWFMGqF5hX_X_ZMz/pub?gid=1412439924&single=true&output=csv';

        async function loadProfile() {
            const app = document.getElementById('app');
            const targetId = decodeURIComponent(window.location.hash.substring(1)); 

            if (!targetId) {
                app.innerHTML = '<h1>Welcome</h1><p>QRコードを読み取ってください</p>';
                return;
            }

            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                
                // CSVを行ごとに分割し、カンマで分割
                const rows = csvText.split('\n').map(row => row.split(',').map(cell => cell.replace(/^"(.*)"$/, '$1')));
                
                // 列の構成を確認：[0]タイムスタンプ, [1]ID, [2]名前, [3]自己紹介... と想定
                const userData = rows.find(row => row[1] && row[1].trim() === targetId);

                if (userData) {
                    app.innerHTML = `
                        <div class="id-badge">ID: ${userData[1]}</div>
                        <h1>${userData[2] || 'No Name'}</h1>
                        <p>${userData[3] || ''}</p>
                    `;
                } else {
                    app.innerHTML = '<h1>Not Found</h1><p>プロフィールが見つかりません。<br>登録直後の場合は、数分待ってから再度読み込んでください。</p>';
                }
            } catch (e) {
                app.innerHTML = '<h1>Error</h1><p>データの読み込みに失敗しました。</p>';
                console.error(e);
            }
        }

        // ハッシュが変わったら再読み込み
        window.addEventListener('hashchange', loadProfile);
        loadProfile();
    </script>
</body>
</html>
